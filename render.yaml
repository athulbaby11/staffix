services:
  - type: web
    name: staffix
    runtime: python
    plan: free # no persistent disk: SQLite and uploads reset on every deploy/restart
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && (if [ -n "$STAFFIX_ADMIN_PASSWORD" ]; then python create_admin.py; fi) && gunicorn staffix.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Host and CSRF origin are derived from RENDER_EXTERNAL_HOSTNAME automatically.
      - key: STAFFIX_ADMIN_EMAIL
        sync: false
      - key: STAFFIX_ADMIN_PASSWORD
        sync: false # admin is (re)created on every start since the DB is ephemeral
