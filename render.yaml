services:
  - type: web
    name: staffix
    runtime: python
    plan: free # no persistent disk: SQLite and uploads reset on every deploy/restart
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn staffix.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. staffix.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://staffix.onrender.com
