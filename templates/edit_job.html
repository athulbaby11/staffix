{% load static %}
{% include 'header.html' %}
<main>
    <section class="register-job container">
        <div class="register-job-heading">
            <div>
                <p class="eyebrow">Admin workspace</p>
                <h1>Update Job</h1>
                <p class="register-job-intro">Keep the listing details accurate and easy for candidates to understand.</p>
            </div>
        </div>
        <div id="edit-job-success" class="form-success" role="status" hidden>
            <i class="bi bi-check-circle-fill"></i>
            <span>Job updated successfully!</span>
        </div>
        <form action="{% url 'edit_job' job.id %}" method="post" id="edit-job-form">
            {% csrf_token %}
            <div class="form-field">
                <label for="company-name">Company Name</label>
                <input type="text" id="company-name" name="company_name" class="capitalize-input" pattern="[A-Z].*" title="First letter must be capital" value="{{ job.company_name }}" required>
            </div>
            <div class="form-field">
                <label for="job-title">Job Title</label>
                <input type="text" id="job-title" name="job_title" class="capitalize-input" pattern="[A-Z].*" title="First letter must be capital" value="{{ job.job_title }}" required>
            </div>
            <div class="form-field form-field-wide">
                <label for="job-description">Job Description</label>
                <textarea id="job-description" name="job_description" class="capitalize-input" required>{{ job.job_description }}</textarea>
            </div>
            <div class="form-field">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" class="capitalize-input" pattern="[A-Z].*" title="First letter must be capital" value="{{ job.location }}" required>
            </div>
            <div class="form-field">
                <label for="salary">Salary/hour</label>
                <div class="input-prefix">
                    <span class="input-prefix-symbol">£</span>
                    <input type="text" id="salary" name="salary" inputmode="decimal" pattern="[0-9]+(\.[0-9]{1,2})?" title="Enter salary amount in pounds, e.g. 25000" value="{{ job.salary }}" required>
                </div>
            </div>
            <div class="form-field">
                <label for="job-type">Job Type</label>
                <select id="job-type" name="job_type" required>
                    <option value="" disabled>Select job type</option>
                    <option value="full_time" {% if job.job_type == 'full_time' %}selected{% endif %}>Full Time</option>
                    <option value="part_time" {% if job.job_type == 'part_time' %}selected{% endif %}>Part Time</option>
                </select>
            </div>
            <div class="form-field">
                <label for="employment-type">Employment Type</label>
                <select id="employment-type" name="employment_type" required>
                    <option value="" disabled>Select employment type</option>
                    <option value="permanent" {% if job.employment_type == 'permanent' %}selected{% endif %}>Permanent</option>
                    <option value="temporary" {% if job.employment_type == 'temporary' %}selected{% endif %}>Temporary</option>
                </select>
            </div>
            <button type="submit" class="button form-submit">Update Job <i class="bi bi-check2"></i></button>
            <a class="text-link form-back-link" href="{% url 'register_view' %}"><i class="bi bi-arrow-left"></i> Back to job list</a>
        </form>
    </section>
</main>
<script>
    // Auto-capitalize the first letter of every text input/textarea marked with .capitalize-input
    document.querySelectorAll('#edit-job-form .capitalize-input').forEach(function (field) {
        field.addEventListener('input', function () {
            if (this.value.length > 0) {
                this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
            }
        });
    });

    // Submit via AJAX, then head back to the job table with a success banner.
    (function () {
        var form = document.getElementById('edit-job-form');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
            })
                .then(function (response) {
                    if (!response.ok) { throw new Error('Request failed'); }
                    return response.json();
                })
                .then(function () {
                    window.location.href = "{% url 'register_view' %}";
                })
                .catch(function () {
                    alert('Something went wrong while updating the job. Please try again.');
                });
        });
    })();
</script>
{% include 'footer.html' %}
